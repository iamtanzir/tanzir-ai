name: Update free model catalog

# Refreshes models-free.json — the bundled free-model fallback — on the 1st of
# every month (06:00 UTC), and whenever someone presses “Run workflow”.
# No secrets are required: the Pollinations /models endpoint is public.

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Refresh bundled free model catalogue
        run: |
          node scripts/update-free-models.js
          # Keep the build copy in sync (dist/ is committed and served by the
          # preview build), so both catalogues stay identical.
          cp models-free.json dist/models-free.json

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models-free.json dist/models-free.json
          if git diff --cached --quiet; then
            echo "No catalogue changes — nothing to commit."
            exit 0
          fi
          git commit -m "chore(models): monthly free model catalog refresh"
          git push
